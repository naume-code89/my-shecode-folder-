<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>class manipulation</title>
    <style>
        .black{
            background-color: black;
        }
        .box{
            background-color: bisque;
            height: 600px;
            width: 100%;
        }
        button{
            border: none;
            background-color: rgb(114, 124, 124);
            color: rgb(121, 39, 39);
            border-radius: 10px;
            padding: 20px;

        }
    </style>
</head>
<body >
    <div class="box" >
    <button>turn dark</button>
     </div>
    <script>
        function turndark() {
            let box = document.querySelector(".box");

            box.classList.add(".black");
        }
        let button = document.querySelector("button");
        button.addEventListener("click", turndark)

    </script>
</body>
</html>
