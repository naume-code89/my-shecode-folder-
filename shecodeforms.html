<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheCodes forms</title>
   <style>
    .menu{
        height: 400px;
        width:  600px;
        border-radius: 10px;
        display: block;
        margin: auto;
        background-color: rgb(25, 99, 99);
        margin-top: 50px;
    }
    .form-1{
        display: flex;
        justify-content: center;
        padding-top: 80px;
        margin-bottom: 30px;
        font-variant: small-caps;
    
    }
    .form-1 .input1{
        border: none;
        height: 30px;
        width: 200px;
        border-radius: 30px;
    }
    .form-2{
        display: flex;
        justify-content: center;
        margin-bottom: 30px;
        font-variant: small-caps;
        border: none;
        

    }
    .form-1 .email{
        color: rgb(195,204, 187);
        font-size: 15px;
    }
   .form-2 .password{
     color: rgb(195, 204, 187);
     font-size: 15px;

   }
    .form-2 .input2{
        border: none;
        height: 30px;
        width: 200px;
        border-radius: 30px;
        color: rgb(88, 39, 39);
        

    }
    .btn{
        display: block;
        margin: 0 auto;
        height: 40px;
        width: 100px;
        border: none;
        border-radius: 20px;
        font-variant: small-caps;
        color: rgb(114, 44, 44);
        transition: 2s;
    }
    .btn:hover{
        background-color: rgb(105, 102, 107);
        color: whitesmoke;
        letter-spacing: 4px;
    }
   </style>
</head>
<body>
    <form  class="menu">
        <div class="form-1">
        <label for="email" class="email">Email&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>&nbsp;&nbsp;&nbsp;
        <input type="email" class="input1" required /> <br>
        </div>
        <br>
        <div class="form-2">
         <label for="password" class="password">Password&nbsp;&nbsp;</label>
        <input type="password" class="input2" required />
        </div>
        <br>
        <button class="btn">submit</button>
    </form>
    
</body>
</html>
